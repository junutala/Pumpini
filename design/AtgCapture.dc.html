<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500&display=swap">
  <style>
    body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#f8f7f5;color:#1a1916;-webkit-font-smoothing:antialiased}
    a{color:#e07b0c;text-decoration:none} a:hover{color:#9a4607}
    .num{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums}
    .crumb{background:#fff;border-bottom:1px solid #e5e3de;padding:11px 16px;flex-shrink:0}
    .dots{display:flex;align-items:center;gap:0;margin-top:9px}
    .dot{width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .bar{flex:1;height:2px;margin:0 3px}
    .cta{width:100%;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px}
    .cta-p{background:#e07b0c;color:#fff}
    .cta-s{background:#fff;border:1px solid #e5e3de;color:#1a1916}
    /* camera and keyboard are SIBLINGS — same height, border, radius */
    .row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e5e3de;border-radius:10px;padding:0 12px;height:50px}
    .val{flex:1;text-align:right;font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:600;min-width:0}
    .ghost{color:#c9c6bf;font-weight:400}
    .src{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;padding:2px 5px;border-radius:4px;white-space:nowrap}
    .s-photo{background:#eef4fd;color:#2563eb}
    .s-typed{background:#f3f2ef;color:#7a7773}
    .cam{width:34px;height:34px;border-radius:8px;border:1px solid #e5e3de;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
  </style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#f8f7f5;overflow:hidden">
  <div class="crumb">
    <div style="display:flex;align-items:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a7773" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span style="font-size:15px;font-weight:700">Photograph the console</span>
      <span style="margin-left:auto;font-size:11.5px;color:#7a7773" class="num">Step 1 of 3</span>
    </div>
    <div class="dots">
      <span class="dot" style="background:#e07b0c;color:#fff">1</span>
      <span class="bar" style="background:#e07b0c"></span>
      <span class="dot" style="background:#f3f2ef;color:#a5a29c">2</span>
      <span class="bar" style="background:#e5e3de"></span>
      <span class="dot" style="background:#f3f2ef;color:#a5a29c">3</span>
    </div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;padding:16px;overflow:hidden">
    <!-- the one instruction that matters -->
    <div style="display:flex;align-items:center;gap:11px;background:#eef4fd;border:1px solid #c9dcf7;border-radius:10px;padding:11px 13px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M17 2.5l2.5 2.5M19.5 5A9 9 0 0 0 12 2"/></svg>
      <div>
        <div style="font-size:13.5px;font-weight:700;color:#1e40af">Turn the phone sideways</div>
        <div style="font-size:12px;color:#3f5d92;margin-top:1px">The console is a wide screen. Landscape fills the frame and reads far better.</div>
      </div>
    </div>

    <!-- landscape viewfinder -->
    <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:18px 0">
      <div style="width:100%;aspect-ratio:16/10;background:#12181f;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center">
        <!-- corner guides -->
        <div style="position:absolute;inset:14px;border-radius:6px;pointer-events:none">
          <div style="position:absolute;top:0;left:0;width:26px;height:26px;border-top:3px solid #FF6B00;border-left:3px solid #FF6B00;border-radius:6px 0 0 0"></div>
          <div style="position:absolute;top:0;right:0;width:26px;height:26px;border-top:3px solid #FF6B00;border-right:3px solid #FF6B00;border-radius:0 6px 0 0"></div>
          <div style="position:absolute;bottom:0;left:0;width:26px;height:26px;border-bottom:3px solid #FF6B00;border-left:3px solid #FF6B00;border-radius:0 0 0 6px"></div>
          <div style="position:absolute;bottom:0;right:0;width:26px;height:26px;border-bottom:3px solid #FF6B00;border-right:3px solid #FF6B00;border-radius:0 0 6px 0"></div>
        </div>
        <!-- ghost of a console screen -->
        <!-- abstract console glow — deliberately NO readable figures. A mockup number
             gets taken for a real one (owner, 27-Aug: no data for filling up spaces). -->
        <div style="opacity:.28;display:flex;flex-direction:column;gap:7px">
          <div style="display:flex;gap:12px"><div style="width:16px;height:9px;background:#8ef0a0;border-radius:2px"></div><div style="width:52px;height:9px;background:#8ef0a0;border-radius:2px"></div><div style="width:66px;height:9px;background:#8ef0a0;border-radius:2px"></div></div>
          <div style="display:flex;gap:12px"><div style="width:16px;height:9px;background:#8ef0a0;border-radius:2px"></div><div style="width:46px;height:9px;background:#8ef0a0;border-radius:2px"></div><div style="width:60px;height:9px;background:#8ef0a0;border-radius:2px"></div></div>
          <div style="display:flex;gap:12px"><div style="width:16px;height:9px;background:#8ef0a0;border-radius:2px"></div><div style="width:50px;height:9px;background:#8ef0a0;border-radius:2px"></div><div style="width:64px;height:9px;background:#8ef0a0;border-radius:2px"></div></div>
        </div>
        <div style="position:absolute;bottom:9px;left:0;right:0;text-align:center;font-size:10.5px;color:rgba(255,255,255,.45)">Fill the frame with the console. Stand square to it — avoid the glare.</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="cta cta-p" style="min-height:56px;font-size:16px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Take the photo
      </button>
      <button class="cta cta-s" style="min-height:52px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a4845" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/></svg>
        Skip — I'll type the readings
      </button>
      <div style="text-align:center;font-size:11.5px;color:#7a7773;padding-top:2px">Typing is a full answer, not a fallback. It is recorded as <b style="color:#4a4845">typed</b>.</div>
    </div>
  </div>
</div>
</x-dc></body></html>
