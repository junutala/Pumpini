<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500&display=swap">
  <style>
    body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#f8f7f5;color:#1a1916;-webkit-font-smoothing:antialiased}
    a{color:#e07b0c;text-decoration:none} a:hover{color:#9a4607}
    .num{font-family:'DM Mono',monospace}
    .crumb{background:#fff;border-bottom:1px solid #e5e3de;padding:11px 16px;flex-shrink:0}
    .dots{display:flex;align-items:center;gap:0;margin-top:9px}
    .dot{width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .bar{flex:1;height:2px;margin:0 3px}
    /* the two inputs are SIBLINGS of equal weight — same height, border, radius */
    .fill{display:flex;align-items:center;justify-content:center;gap:9px;height:52px;border:1.5px solid #e07b0c;
      background:#fff8ed;color:#9a4607;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
    .row{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #e5e3de;border-radius:10px;padding:0 13px;height:52px}
    .val{flex:1;text-align:right;font-family:'DM Mono',monospace;font-size:16px;font-weight:600;min-width:0}
    .ghost{color:#c9c6bf;font-weight:400}
    .src{font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
    .src-photo{background:#eef4fd;color:#2563eb}
    .src-typed{background:#f3f2ef;color:#7a7773}
  </style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#f8f7f5;overflow:hidden">
  <div class="crumb">
    <div style="display:flex;align-items:center;gap:6px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7a7773" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <span style="font-size:12.5px;color:#7a7773">Tank Recon</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7a7773" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      <span style="font-size:13.5px;font-weight:700">Nozzle readings</span>
      <span style="margin-left:auto;font-size:12px;color:#7a7773">Step <span class="num">3</span>/<span class="num">4</span></span>
    </div>
    <div class="dots">
      <span class="dot" style="background:#16a34a;color:#fff"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><span class="bar" style="background:#16a34a"></span>
      <span class="dot" style="background:#16a34a;color:#fff"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><span class="bar" style="background:#e07b0c"></span>
      <span class="dot" style="background:#e07b0c;color:#fff">3</span><span class="bar" style="background:#e5e3de"></span>
      <span class="dot" style="background:#f3f2ef;color:#7a7773">4</span>
    </div>
  </div>

  <div style="flex:1;overflow:hidden;padding:16px;display:flex;flex-direction:column">
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <div style="font-size:18px;font-weight:700">Twelve nozzles</div>
      <span style="font-size:13px;color:#7a7773"><span class="num" style="font-weight:600;color:#1a1916">0</span>/<span class="num">12</span></span>
    </div>
    <div style="font-size:13px;color:#4a4845;margin-top:3px;line-height:1.5">Work down the list, or lay the slips out and fill them all at once.</div>

    <button class="fill" style="margin-top:14px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      Fill from a photo of the slips
    </button>

    <div style="display:flex;align-items:center;gap:10px;margin:14px 0">
      <span style="flex:1;height:1px;background:#e5e3de"></span>
      <span style="font-size:11.5px;color:#7a7773">or type below</span>
      <span style="flex:1;height:1px;background:#e5e3de"></span>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;gap:7px;overflow:hidden">
      <div class="row" style="height:46px;border:1.5px solid #e07b0c">
        <span style="font-size:13px;font-weight:600;white-space:nowrap">17EH2900V.1</span>
        <span class="val ghost">0.00</span>
        <span style="width:2px;height:20px;background:#e07b0c;flex-shrink:0"></span>
      </div>
      <div class="row" style="height:46px"><span style="font-size:13px;font-weight:600">17EH2900V.2</span><span class="val ghost">0.00</span></div>
      <div class="row" style="height:46px"><span style="font-size:13px;font-weight:600">17EH2910V.1</span><span class="val ghost">0.00</span></div>
      <div class="row" style="height:46px"><span style="font-size:13px;font-weight:600">17EH2910V.2</span><span class="val ghost">0.00</span></div>
      <div class="row" style="height:46px"><span style="font-size:13px;font-weight:600">17CH2653V.1</span><span class="val ghost">0.00</span></div>
      <div class="row" style="height:46px"><span style="font-size:13px;font-weight:600">17CH2653V.2</span><span class="val ghost">0.00</span></div>
      <div class="row" style="height:46px"><span style="font-size:13px;font-weight:600">17CH2645V.1</span><span class="val ghost">0.00</span></div>
      <div style="font-size:11.5px;color:#7a7773;text-align:center;padding-top:2px">5 more below</div>
    </div>

    <div style="padding-top:12px">
      <button style="width:100%;background:#e07b0c;color:#fff;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;min-height:52px;opacity:.45">Continue</button>
    </div>
  </div>
</div>
</x-dc></body></html>
