name: CI

# Gate every change into the two protected branches BEFORE it can merge and
# auto-deploy (frontend -> Vercel, backend -> Railway). This exists because on
# 2026-07-22 a truncated route file (stations.js lost `module.exports = router`)
# shipped to main and crash-looped the backend for every outlet. These jobs
# catch that class of failure without needing a database.
#
# Documentation-only changes are skipped, to stop a markdown edit spending a
# full Next.js build. GitHub skips a run only when EVERY changed path matches,
# so a commit touching both a doc and a route still runs the full gate — the
# outage guard is never weakened by this. The listed paths are inert: none is
# read by the Next.js build or required by a backend route, and `marketing/` is
# collateral no build references. Anything that can actually break a deploy
# (frontend/, backend/, package.json, vercel.json) is deliberately absent from
# the list and always triggers CI.
#
# ⚠️ If these jobs are ever made REQUIRED status checks in branch protection,
# delete the two paths-ignore blocks first. A required check that never runs
# stays pending forever, so every docs-only PR would become unmergeable.
# (Safe today: neither main nor staging is a protected branch.)
#
# (The two lists below are duplicated on purpose: the Actions parser does not
# support YAML anchors, so they cannot be shared. Keep them in step.)
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'marketing/**'
      - '**/*.md'
  push:
    branches: [main, staging]
    paths-ignore:
      - 'docs/**'
      - 'marketing/**'
      - '**/*.md'

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No lockfile in the repo (neither frontend nor backend), so `npm ci`
      # cannot run — use `npm install`. If a package-lock.json is added later,
      # switch this to `npm ci` for reproducible installs.
      - name: Install dependencies
        # --loglevel=error silences the per-package progress and the "added N
        # packages" summary, which is the bulk of the ~1.1 MB of log each job
        # stored. Errors and the install's exit code are unaffected, so a failed
        # install still fails the job and still says why.
        run: npm install --no-audit --no-fund --loglevel=error

      # A real compile/import break must fail here. Provide safe dummy env so
      # that a *missing runtime env var* can never mask a genuine build error:
      # everything the build reads (NEXT_PUBLIC_API_URL, build id) has a code
      # fallback, so these are belt-and-braces only.
      # An undefined identifier is a RUNTIME error, not a compile error, and
      # `next build` skips linting — so a page that references a helper it forgot
      # to import builds perfectly green and then throws in the user's browser.
      # That shipped on 2026-08-23: a patch script aborted midway, `toInstant(...)`
      # landed in app/lead/page.js without its import, CI passed, and SAVE was
      # broken in the field tool until a screenshot came back.
      #
      # Only `no-undef` is enforced, with no config inherited: the repo has
      # pre-existing react-hooks/rules-of-hooks errors that are none of this
      # gate's business, and a gate that fails for unrelated reasons gets muted.
      # --no-inline-config so eslint-disable comments naming rules this minimal
      # config does not load cannot fail the run.
      - name: Undefined-identifier check (no-undef only)
        run: |
          npx eslint --no-eslintrc --no-inline-config \
            --env browser,es2022,node \
            --parser-options 'ecmaVersion:2022,sourceType:module,ecmaFeatures:{jsx:true}' \
            --rule '{"no-undef":"error"}' \
            'src/**/*.js'

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://dummy.invalid
          NEXT_TELEMETRY_DISABLED: '1'
          CI: 'true'
        run: npm run build

  backend-boot-check:
    name: Backend boot / route-export check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # --loglevel=error silences the per-package progress and the "added N
        # packages" summary, which is the bulk of the ~1.1 MB of log each job
        # stored. Errors and the install's exit code are unaffected, so a failed
        # install still fails the job and still says why.
        run: npm install --no-audit --no-fund --loglevel=error

      # Cheap syntax guard across ALL backend source: catches unbalanced
      # braces / partial edits that would throw only when the file is loaded.
      - name: Syntax check (node --check) all backend source
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      # The real prod-outage guard: require() every route module and assert it
      # exports a usable Express router. Reproduces nothing against the DB and
      # never calls listen() — it fails loudly (non-zero) naming the offending
      # file if a route is truncated / missing `module.exports = router`, which
      # is exactly what took prod down on 2026-07-22.
      - name: Route export check
        run: node scripts/ci-route-check.js

      # ONE NOZZLE NAME. A convention that lives in memory drifts back the week
      # after it is fixed: PR #304 named every nozzle coming from the `nozzles`
      # table and was believed complete, but the slip reader builds its lines from
      # OCR output — no nozzles row — so `nozzle_name` was never set there and our
      # internal index ("1.1") reached the manager for four months. It survived
      # because it only shows when a slip FAILS to match. This makes it fail here.
      - name: One nozzle name check
        run: node scripts/ci-nozzle-name-check.js

      # 🔴 THE SAME no-undef GATE THE FRONTEND HAS HAD SINCE 2026-08-23, NOW ON THE
      # BACKEND — because the backend never had it, and that cost a live feature.
      # On 18-Sep-2026 `PATCH /api/deliveries/apply-lfr` answered every single call with
      # "hasColumn is not defined": the helper was called in the handler and never
      # imported. A SECOND one, `matchCard`, sat undiscovered on the next line of the
      # same route, hidden behind the first. Every other gate above passed it green —
      # `node --check` sees valid syntax, and the route-export check only require()s the
      # module, so a ReferenceError INSIDE a handler does not throw until a real request
      # arrives. Result: 0 of 189 deliveries ever carried an LFR figure, and the screen
      # said "LFR added to the cost" each time.
      #
      # eslint is pinned to 8 because --no-eslintrc/--env are v8 flags (v9 is flat
      # config), matching the frontend job. Only no-undef, no inherited config, so this
      # can never fail for unrelated style reasons and get muted.
      - name: Undefined-identifier check (no-undef only)
        run: |
          npx --yes eslint@8 --no-eslintrc --no-inline-config \
            --env node,es2022 \
            --parser-options 'ecmaVersion:2022,sourceType:script' \
            --rule '{"no-undef":"error"}' \
            'src/**/*.js'

      # A control must not be unmounted by its own onChange. Catches the City → "Other
      # (type below)" class of bug, where the box writes the very state that renders it,
      # so the first keystroke closes the field. Reported by the owner on Settings on
      # 18-Sep-2026; sweeping for the shape found it a second time on the Lubes
      # catalogue HSN field, unreported. Invisible to eslint and to `next build` — every
      # line is valid and only the pair is wrong.
      - name: No self-unmounting controls
        run: node scripts/ci-self-unmount-check.js

      # The gauge matcher is mirrored into the CJS test suite. A mirror that drifts
      # asserts yesterday's rules while passing, which is worse than no test at all.
      - name: Gauge-matcher mirror is in sync
        run: node scripts/ci-gauge-match-sync.js

      # Every column a SQL write names must exist in production. On 22-Sep-2026 a
      # manager could not add a vehicle because routes/corporate.js wrote
      # `driver_name` to a table whose column is `name` — wrong since the screen was
      # written, at every outlet. eslint reads JS scope and a column name in a
      # template literal is just text; `next build` never sees it; the tests never
      # open a database. So the only thing catching a typed column was a manager
      # pressing the button in production. Checks INSERT, ON CONFLICT DO UPDATE and
      # UPDATE against backend/db/schema.prod.json; reads (SELECT/WHERE/ORDER BY) go
      # through aliases and are deliberately out of scope — see the script's header.
      - name: SQL columns exist in production
        run: node scripts/ci-sql-schema-check.js

      # The same outage had a SECOND half: the list's `ORDER BY driver_name`, which
      # threw no alert and simply 500'd — the way a screen goes quietly broken for
      # months. Reads are most of the code and therefore most of the exposure, and a
      # manager meets a broken SELECT by seeing nothing, which is the failure mode
      # nobody reports. Resolves table aliases from FROM/JOIN and checks qualified
      # references, plus bare ORDER BY in single-table queries. Anything it cannot
      # prove — an alias rebound inside a CTE, an unqualified column in a join — it
      # skips rather than guesses: a gate people learn to ignore is worse than none.
      - name: SQL reads name real columns
        run: node scripts/ci-sql-read-check.js

      # A translation that drifts away from its fallback SILENTLY WINS, and if it has
      # lost a {placeholder} the value is never rendered. On 31-Aug a manager was told
      # "No opening dip has been recorded for:" and then nothing — the code filled
      # {list}, en.json carried an older sentence without it, and the dialog refused to
      # say which tank. Both strings read fine alone; only the pair is wrong, which is
      # exactly what a check is for.
      - name: i18n placeholder check
        run: node scripts/ci-i18n-placeholder-check.js

      # The unit tests existed since July and NOTHING RAN THEM. Three files pinning
      # the opening carry-forward, margins and data health sat green-by-default in
      # the repo while CI checked only that routes export a router. A test nobody
      # runs is a comment.
      # The glob is UNQUOTED so the SHELL expands it, not node. Quoted, node gets the
      # literal string "test/*.test.js" — and node's own --test glob support only
      # arrived in v21, while this job pins node 20. So the step could never find a
      # test and failed every run from the day it was added (#352), red on main for
      # two days while the suite underneath it was passing 31/31. A CI step that can
      # never pass teaches everyone to ignore CI.
      - name: Unit tests
        run: node --test test/*.test.js
